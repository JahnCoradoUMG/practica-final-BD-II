global:
  resolve_timeout: 5m

route:
  receiver: dataops-webhook
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: dataops-webhook
    webhook_configs:
      - url: http://api:3000/api/alerts/webhook/prometheus
        send_resolved: true
