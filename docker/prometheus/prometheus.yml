global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: dataops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: postgres-metadata
    static_configs:
      - targets: ["postgres-exporter:9187"]
